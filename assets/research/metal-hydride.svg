  <text x="1086" y="371" fill="#93a59c" font-size="13" text-anchor="end">Thermal contours</text>
  <text x="676" y="400" fill="#c4d3cc" font-size="14">Exothermic heat release creates local hot zones; copper pathways reduce gradients.</text>

  <rect x="652" y="440" width="500" height="195" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="676" y="473" fill="#eef3ef" font-size="17" font-weight="600">Temperature evolution in the hydride bed</text>
  <path d="M702 500V594H1118" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <text x="692" y="508" fill="#93a59c" font-size="13" text-anchor="end">T</text>
  <text x="1118" y="614" fill="#93a59c" font-size="13" text-anchor="end">Time</text>
  <path d="M706 580C734 545 752 508 786 506C825 504 834 556 878 560C918 563 944 526 982 530C1020 532 1040 572 1114 576" fill="none" stroke="#ff9f6e" stroke-width="3"/>
  <path d="M706 580C740 558 768 540 800 542C842 544 860 566 900 568C946 570 968 546 1004 548C1048 550 1070 574 1114 580" fill="none" stroke="#4fd1e8" stroke-width="3"/>
