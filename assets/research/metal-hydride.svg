<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Metal hydride hydrogen storage reactor with heat exchanger, PCT isotherms and bed temperature</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1512"/><stop offset="1" stop-color="#132520"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fc3b6" stroke-opacity=".05"/></pattern>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4a45"/><stop offset=".45" stop-color="#7e948c"/><stop offset="1" stop-color="#2f3d39"/></linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3f3a"/><stop offset="1" stop-color="#2e2826"/></linearGradient>
    <pattern id="powder" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="2.2" fill="#8a7a70"/><circle cx="10" cy="9" r="1.8" fill="#a08e82"/><circle cx="6" cy="12" r="1.4" fill="#6f625b"/></pattern>
    <radialGradient id="heat" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff7a5c" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a5c" stop-opacity="0"/></radialGradient>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f6e"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fd1e8"/></marker>
    <g id="h2"><circle cx="-5" cy="0" r="5.5" fill="#e8f4ff" stroke="#8fb8ff" stroke-width="1.5"/><circle cx="5" cy="0" r="5.5" fill="#e8f4ff" stroke="#8fb8ff" stroke-width="1.5"/></g>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="56" fill="#d98b65" font-size="15" font-weight="700" letter-spacing="3">03-C · MULTIPHYSICS SIMULATION FOR SMART MANUFACTURING</text>
  <text x="48" y="92" fill="#eef3ef" font-size="29" font-weight="600">Hydrogen Storage with Metal Hydride</text>

  <rect x="48" y="120" width="592" height="515" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <!-- inlet -->
  <rect x="270" y="132" width="20" height="50" fill="url(#shell)"/>
  <path d="M262 150h36l-18 12z M262 174h36l-18-12z" fill="#d98b65"/>
  <use href="#h2" x="250" y="146"/><use href="#h2" x="312" y="168"/>
  <!-- vessel -->
  <rect x="160" y="182" width="240" height="420" rx="60" fill="url(#shell)" stroke="#9fb3aa" stroke-width="2"/>
  <rect x="176" y="198" width="208" height="388" rx="48" fill="url(#bed)"/>
  <rect x="176" y="198" width="208" height="388" rx="48" fill="url(#powder)"/>
  <!-- HX tubes -->
  <path d="M206 600V250Q206 228 228 228Q250 228 250 250V560Q250 582 272 582Q294 582 294 560V250Q294 228 316 228Q338 228 338 250V560Q338 582 360 582V610" fill="none" stroke="#1a2b30" stroke-width="16" stroke-linecap="round"/>
  <path d="M206 600V250Q206 228 228 228Q250 228 250 250V560Q250 582 272 582Q294 582 294 560V250Q294 228 316 228Q338 228 338 250V560Q338 582 360 582V610" fill="none" stroke="#4fd1e8" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="228" cy="360" rx="34" ry="60" fill="url(#heat)"/><ellipse cx="316" cy="420" rx="34" ry="60" fill="url(#heat)"/><ellipse cx="272" cy="300" rx="30" ry="50" fill="url(#heat)"/>
  <g fill="none" stroke="#ff9f6e" stroke-width="2.5" marker-end="url(#ao)"><path d="M228 330L212 316"/><path d="M228 390L244 404"/><path d="M316 400L332 386"/><path d="M272 300L288 286"/></g>
  <use href="#h2" x="272" y="216"/><use href="#h2" x="228" y="470"/><use href="#h2" x="320" y="330"/>
  <g fill="none" stroke="#4fd1e8" stroke-width="3" marker-end="url(#ac)"><path d="M206 640V618"/><path d="M360 616V640"/></g>
  <text x="206" y="626" fill="#8fe3ee" font-size="13" text-anchor="end" dx="-8">in</text>
  <text x="368" y="632" fill="#8fe3ee" font-size="13">out</text>

  <!-- labels -->
  <g stroke="#6d847b" stroke-width="1.5"><path d="M300 156H430"/><path d="M384 270H430"/><path d="M342 340H430"/><path d="M318 440H430"/></g>
  <text x="438" y="161" fill="#d7e3dd" font-size="16">H₂ in / out</text>
  <text x="438" y="275" fill="#d7e3dd" font-size="16">Metal hydride bed</text>
  <text x="438" y="345" fill="#8fe3ee" font-size="16">Heat exchanger</text>
  <text x="438" y="366" fill="#93a59c" font-size="14">coolant / heating fluid</text>
  <text x="438" y="445" fill="#ffb38a" font-size="16">Reaction heat</text>
  <rect x="432" y="500" width="188" height="104" rx="12" fill="#15211d" stroke="#2d3f38"/>
  <text x="526" y="534" fill="#eef3ef" font-size="17" text-anchor="middle">M + x/2 H₂ ⇌ MHₓ</text>
  <text x="526" y="560" fill="#ffb38a" font-size="14" text-anchor="middle">absorption: heat out</text>
  <text x="526" y="582" fill="#8fe3ee" font-size="14" text-anchor="middle">desorption: heat in</text>

  <!-- PCT -->
  <rect x="664" y="120" width="488" height="330" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="688" y="152" fill="#eef3ef" font-size="17" font-weight="600">Pressure–composition isotherms</text>
  <path d="M720 410C740 396 750 382 775 370L1000 362C1030 358 1045 320 1060 260" fill="none" stroke="#5e9aff" stroke-width="3"/>
  <path d="M720 410C738 380 750 322 775 310L1000 302C1030 298 1045 260 1060 200" fill="none" stroke="#2fc77a" stroke-width="3"/>
  <path d="M720 410C736 360 750 262 775 250L1000 242C1030 238 1045 205 1058 172" fill="none" stroke="#ff7a5c" stroke-width="3"/>
  <path d="M712 165V410H1125" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <text x="704" y="176" fill="#93a59c" font-size="13" text-anchor="end">ln P</text>
  <text x="1125" y="432" fill="#93a59c" font-size="13" text-anchor="end">H/M (hydrogen content)</text>
  <text x="887" y="392" fill="#93a59c" font-size="13" text-anchor="middle">α + β plateau</text>
  <g font-size="14" font-weight="600"><text x="1072" y="266" fill="#8fb8ff">T₁</text><text x="1072" y="206" fill="#6fe0a6">T₂</text><text x="1070" y="180" fill="#ffa58f">T₃</text></g>
  <text x="1128" y="152" fill="#93a59c" font-size="13" text-anchor="end">T₁ &lt; T₂ &lt; T₃</text>

  <!-- bed temperature -->
  <rect x="664" y="470" width="488" height="165" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="688" y="500" fill="#eef3ef" font-size="17" font-weight="600">Bed temperature during absorption</text>
  <path d="M705 605C722 520 750 515 800 535S950 585 1115 595" fill="none" stroke="#ff7a5c" stroke-width="3"/>
  <path d="M705 605C720 540 740 535 770 555S900 600 1115 603" fill="none" stroke="#4fd1e8" stroke-width="3"/>
  <path d="M700 515V610H1125" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <text x="1125" y="628" fill="#93a59c" font-size="13" text-anchor="end">time</text>
  <path d="M940 528h18" stroke="#ff7a5c" stroke-width="3"/><text x="964" y="533" fill="#c4d3cc" font-size="13">baseline reactor</text>
  <path d="M940 552h18" stroke="#4fd1e8" stroke-width="3"/><text x="964" y="557" fill="#c4d3cc" font-size="13">optimized heat exchanger</text>
</svg>
