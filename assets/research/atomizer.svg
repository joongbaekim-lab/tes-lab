<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Gas atomizer simulation with VOF and DPM, particle detection and particle size distribution</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1512"/><stop offset="1" stop-color="#132520"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fc3b6" stroke-opacity=".05"/></pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4a45"/><stop offset=".5" stop-color="#6b8079"/><stop offset="1" stop-color="#3a4a45"/></linearGradient>
    <linearGradient id="melt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a1"/><stop offset=".4" stop-color="#ffb347"/><stop offset="1" stop-color="#e8541f"/></linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1e8" stop-opacity=".55"/><stop offset="1" stop-color="#4fd1e8" stop-opacity="0"/></linearGradient>
    <radialGradient id="sem" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#f2f2f2"/><stop offset=".55" stop-color="#9ea4a8"/><stop offset="1" stop-color="#4a5055"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .27  0 0 0 0 .29  0 0 0 .55 0"/></filter>
    <clipPath id="semclip"><rect x="688" y="160" width="220" height="190" rx="6"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="56" fill="#d98b65" font-size="15" font-weight="700" letter-spacing="3">03-A · MULTIPHYSICS SIMULATION FOR SMART MANUFACTURING</text>
  <text x="48" y="92" fill="#eef3ef" font-size="29" font-weight="600">Gas Atomization of Metal Powder (VOF + DPM)</text>

  <rect x="48" y="120" width="592" height="515" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <!-- chamber -->
  <path d="M206 300L150 620M434 300L490 620" stroke="#2d3f38" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- crucible -->
  <path d="M222 132H418L404 214H236Z" fill="url(#metal)" stroke="#7e948c" stroke-width="2"/>
  <path d="M236 150H404L394 206H246Z" fill="url(#melt)"/>
  <ellipse cx="320" cy="152" rx="82" ry="6" fill="#fff6c8" opacity=".7"/>
  <g fill="none" stroke="#d98b65" stroke-width="5"><path d="M214 150v8M214 172v8M214 194v8M426 150v8M426 172v8M426 194v8"/></g>
  <!-- melt nozzle -->
  <rect x="310" y="214" width="20" height="62" fill="url(#metal)" stroke="#7e948c"/>
  <rect x="316" y="214" width="8" height="62" fill="url(#melt)"/>
  <!-- gas die -->
  <path d="M214 250H302L308 290H226Z" fill="url(#metal)" stroke="#7e948c" stroke-width="2"/>
  <path d="M426 250H338L332 290H414Z" fill="url(#metal)" stroke="#7e948c" stroke-width="2"/>
  <path d="M250 262L300 286M390 262L340 286" stroke="#4fd1e8" stroke-width="4" stroke-linecap="round"/>
  <!-- jets -->
  <path d="M300 290L332 352L360 520L280 520L308 352Z" fill="url(#jet)" opacity=".0"/>
  <path d="M302 292L322 340L250 560" fill="none" stroke="#4fd1e8" stroke-width="3" stroke-dasharray="10 7" opacity=".8"/>
  <path d="M338 292L318 340L390 560" fill="none" stroke="#4fd1e8" stroke-width="3" stroke-dasharray="10 7" opacity=".8"/>
  <!-- primary breakup (VOF) -->
  <path d="M316 276C316 300 314 318 310 338C302 354 294 360 286 376C300 372 306 362 314 352C318 368 312 384 306 396C320 386 326 370 326 352C334 362 340 372 354 378C346 362 336 352 330 338C326 318 324 300 324 276Z" fill="url(#melt)"/>
  <path d="M310 338C302 354 294 360 286 376" fill="none" stroke="#ffd166" stroke-width="6" opacity=".35" filter="url(#glow)"/>
  <!-- secondary breakup droplets (DPM) -->
  <g>
    <g fill="#ffb347"><circle cx="282" cy="392" r="6"/><circle cx="356" cy="394" r="6"/><circle cx="300" cy="410" r="5"/><circle cx="336" cy="412" r="5.5"/><circle cx="318" cy="420" r="5"/><circle cx="270" cy="420" r="4.5"/><circle cx="366" cy="424" r="4.5"/></g>
    <g fill="#ff9d4a"><circle cx="288" cy="446" r="4"/><circle cx="350" cy="450" r="4"/><circle cx="318" cy="458" r="3.5"/><circle cx="258" cy="456" r="3.5"/><circle cx="380" cy="462" r="3.5"/><circle cx="304" cy="476" r="3"/><circle cx="336" cy="482" r="3.5"/><circle cx="240" cy="486" r="3"/><circle cx="396" cy="490" r="3"/></g>
    <g fill="#c79a7e"><circle cx="276" cy="508" r="3"/><circle cx="364" cy="512" r="3"/><circle cx="318" cy="520" r="2.6"/><circle cx="226" cy="526" r="2.6"/><circle cx="410" cy="528" r="2.6"/><circle cx="296" cy="542" r="2.4"/><circle cx="344" cy="548" r="2.6"/><circle cx="252" cy="556" r="2.2"/><circle cx="386" cy="560" r="2.4"/></g>
    <g fill="#a9b2b5"><circle cx="210" cy="580" r="2.2"/><circle cx="270" cy="586" r="2.4"/><circle cx="318" cy="590" r="2"/><circle cx="366" cy="584" r="2.4"/><circle cx="426" cy="588" r="2.2"/><circle cx="240" cy="606" r="2"/><circle cx="300" cy="610" r="2.2"/><circle cx="342" cy="606" r="2"/><circle cx="398" cy="608" r="2.2"/><circle cx="452" cy="604" r="2"/><circle cx="188" cy="604" r="2"/></g>
  </g>
  <!-- labels -->
  <g stroke="#6d847b" stroke-width="1.5"><path d="M420 172H470"/><path d="M332 236H470"/><path d="M416 270H470"/><path d="M356 366H470"/><path d="M400 470H470"/><path d="M456 596H470"/></g>
  <text x="478" y="177" fill="#ffd98a" font-size="16">Molten metal</text>
  <text x="478" y="241" fill="#d7e3dd" font-size="16">Melt nozzle</text>
  <text x="478" y="275" fill="#8fe3ee" font-size="16">High-pressure gas</text>
  <text x="478" y="362" fill="#ffb38a" font-size="16" font-weight="600">Primary breakup</text>
  <text x="478" y="382" fill="#93a59c" font-size="14">VOF · interface</text>
  <text x="478" y="466" fill="#ffb38a" font-size="16" font-weight="600">Secondary breakup</text>
  <text x="478" y="486" fill="#93a59c" font-size="14">DPM · droplets</text>
  <text x="478" y="601" fill="#d7e3dd" font-size="16">Solid powder</text>

  <!-- particle detection -->
  <rect x="664" y="120" width="488" height="250" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <g clip-path="url(#semclip)">
    <rect x="688" y="160" width="220" height="190" fill="#2e3337"/>
    <rect x="688" y="160" width="220" height="190" filter="url(#noise)"/>
    <g fill="url(#sem)"><circle cx="726" cy="200" r="24"/><circle cx="786" cy="190" r="15"/><circle cx="840" cy="214" r="28"/><circle cx="890" cy="180" r="12"/><circle cx="716" cy="270" r="17"/><circle cx="770" cy="252" r="22"/><circle cx="790" cy="310" r="18"/><circle cx="846" cy="290" r="20"/><circle cx="890" cy="252" r="14"/><circle cx="740" cy="326" r="11"/><circle cx="886" cy="326" r="16"/></g>
    <g fill="none" stroke="#2fc77a" stroke-width="2"><circle cx="726" cy="200" r="25"/><circle cx="786" cy="190" r="16"/><circle cx="840" cy="214" r="29"/><circle cx="890" cy="180" r="13"/><circle cx="716" cy="270" r="18"/><circle cx="770" cy="252" r="23"/><circle cx="790" cy="310" r="19"/><circle cx="846" cy="290" r="21"/><circle cx="890" cy="252" r="15"/><circle cx="740" cy="326" r="12"/><circle cx="886" cy="326" r="17"/></g>
  </g>
  <text x="932" y="160" fill="#eef3ef" font-size="17" font-weight="600">Particle detection</text>
  <text x="932" y="183" fill="#93a59c" font-size="14">high-accuracy algorithm</text>
  <g font-size="15" fill="#d7e3dd">
    <circle cx="940" cy="222" r="4" fill="#2fc77a"/><text x="954" y="227">Overlap separation</text>
    <circle cx="940" cy="256" r="4" fill="#2fc77a"/><text x="954" y="261">Contour fitting</text>
    <circle cx="940" cy="290" r="4" fill="#2fc77a"/><text x="954" y="295">Size · sphericity</text>
    <circle cx="940" cy="324" r="4" fill="#2fc77a"/><text x="954" y="329">Satellite check</text>
  </g>

  <!-- PSD -->
  <rect x="664" y="390" width="488" height="245" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="688" y="422" fill="#eef3ef" font-size="17" font-weight="600">Particle size distribution</text>
  <g fill="#5e9aff" opacity=".85">
    <rect x="712" y="580" width="26" height="12"/><rect x="742" y="556" width="26" height="36"/><rect x="772" y="516" width="26" height="76"/><rect x="802" y="476" width="26" height="116"/><rect x="832" y="458" width="26" height="134"/><rect x="862" y="470" width="26" height="122"/><rect x="892" y="500" width="26" height="92"/><rect x="922" y="530" width="26" height="62"/><rect x="952" y="552" width="26" height="40"/><rect x="982" y="568" width="26" height="24"/><rect x="1012" y="578" width="26" height="14"/><rect x="1042" y="584" width="26" height="8"/><rect x="1072" y="588" width="26" height="4"/>
  </g>
  <path d="M712 590C760 580 780 500 820 470C846 450 860 454 880 468C920 500 960 560 1010 578C1050 588 1080 590 1110 591" fill="none" stroke="#ff9f6e" stroke-width="3"/>
  <path d="M700 446V592H1120" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <g stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4 4"><path d="M790 592V448"/><path d="M856 592V448"/><path d="M950 592V448"/></g>
  <g fill="#ffd98a" font-size="13" text-anchor="middle"><text x="790" y="442">D10</text><text x="856" y="442">D50</text><text x="950" y="442">D90</text></g>
  <text x="1120" y="612" fill="#93a59c" font-size="13" text-anchor="end">particle diameter</text>
  <rect x="984" y="452" width="14" height="12" fill="#5e9aff"/><text x="1004" y="463" fill="#c4d3cc" font-size="13">Simulation</text>
  <path d="M984 482h14" stroke="#ff9f6e" stroke-width="3"/><text x="1004" y="487" fill="#c4d3cc" font-size="13">Measured</text>
</svg>
