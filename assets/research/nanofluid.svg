<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Plasmonic nanofluid direct-absorption solar collector with localized surface plasmon resonance and thermal storage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1512"/><stop offset="1" stop-color="#132520"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fc3b6" stroke-opacity=".05"/></pattern>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4c2"/><stop offset=".6" stop-color="#ffd166"/><stop offset="1" stop-color="#f5a623"/></radialGradient>
    <linearGradient id="fluid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a5fb8"/><stop offset=".5" stop-color="#8a4f8c"/><stop offset="1" stop-color="#e8743a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8743a"/><stop offset=".55" stop-color="#9a4b5a"/><stop offset="1" stop-color="#2a5fb8"/></linearGradient>
    <radialGradient id="np" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#f0b43c"/><stop offset="1" stop-color="#9a6510"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="tube"><rect x="112" y="332" width="586" height="76" rx="38"/></clipPath>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e9aff"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f6e"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="56" fill="#d98b65" font-size="15" font-weight="700" letter-spacing="3">02-C · ECO-FRIENDLY &amp; RENEWABLE ENERGY</text>
  <text x="48" y="92" fill="#eef3ef" font-size="29" font-weight="600">Plasmonic Nanofluids for Solar Thermal Collection</text>

  <rect x="48" y="120" width="700" height="515" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="72" y="152" fill="#eef3ef" font-size="17" font-weight="600">Direct-absorption solar collector</text>
  <circle cx="132" cy="214" r="50" fill="#ffd166" opacity=".35" filter="url(#glow2)"/>
  <circle cx="132" cy="214" r="30" fill="url(#sun)"/>
  <g fill="none" stroke="#ffd166" stroke-width="2.5" stroke-opacity=".9" marker-end="url(#ay)">
    <path d="M200 200L262 326"/><path d="M262 188L324 326"/><path d="M324 176L386 326"/><path d="M386 176L448 326"/><path d="M448 176L510 326"/><path d="M510 176L572 326"/>
  </g>

  <path d="M700 370H726V446H648V474" fill="none" stroke="#e8743a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M590 590H82V370H110" fill="none" stroke="#2a5fb8" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="300" cy="590" r="18" fill="#1b2a26" stroke="#5e9aff" stroke-width="3"/>
  <path d="M292 590l12-7v14z" fill="#5e9aff"/>
  <text x="300" y="625" fill="#93a59c" font-size="13" text-anchor="middle">pump</text>
  <g fill="none" stroke-width="3"><path d="M60 452V410" stroke="#5e9aff" marker-end="url(#ab)"/><path d="M740 404V430" stroke="#ff9f6e" marker-end="url(#ao)"/></g>
  <text x="66" y="482" fill="#8fb8ff" font-size="14">cold</text>
  <text x="716" y="466" fill="#ffb38a" font-size="14" text-anchor="end">hot</text>

  <rect x="112" y="332" width="586" height="76" rx="38" fill="url(#fluid)"/>
  <g clip-path="url(#tube)">
    <g fill="#ffd166" opacity=".55" filter="url(#glow)">
      <circle cx="150" cy="356" r="6"/><circle cx="196" cy="384" r="6"/><circle cx="240" cy="350" r="6"/><circle cx="288" cy="390" r="6"/><circle cx="330" cy="360" r="6"/><circle cx="376" cy="388" r="6"/><circle cx="420" cy="352" r="6"/><circle cx="462" cy="384" r="6"/><circle cx="508" cy="358" r="6"/><circle cx="552" cy="392" r="6"/><circle cx="596" cy="352" r="6"/><circle cx="640" cy="382" r="6"/><circle cx="676" cy="360" r="6"/>
    </g>
    <g fill="url(#np)">
      <circle cx="150" cy="356" r="4"/><circle cx="174" cy="396" r="3"/><circle cx="196" cy="384" r="4"/><circle cx="218" cy="366" r="3"/><circle cx="240" cy="350" r="4"/><circle cx="264" cy="372" r="3"/><circle cx="288" cy="390" r="4"/><circle cx="308" cy="346" r="3"/><circle cx="330" cy="360" r="4"/><circle cx="352" cy="398" r="3"/><circle cx="376" cy="388" r="4"/><circle cx="398" cy="364" r="3"/><circle cx="420" cy="352" r="4"/><circle cx="440" cy="398" r="3"/><circle cx="462" cy="384" r="4"/><circle cx="486" cy="344" r="3"/><circle cx="508" cy="358" r="4"/><circle cx="530" cy="378" r="3"/><circle cx="552" cy="392" r="4"/><circle cx="574" cy="366" r="3"/><circle cx="596" cy="352" r="4"/><circle cx="618" cy="398" r="3"/><circle cx="640" cy="382" r="4"/><circle cx="662" cy="346" r="3"/><circle cx="676" cy="360" r="4"/>
    </g>
  </g>
  <rect x="112" y="332" width="586" height="76" rx="38" fill="url(#glass)" stroke="#bfe0e8" stroke-opacity=".6" stroke-width="2"/>
  <text x="405" y="446" fill="#eef3ef" font-size="17" font-weight="600" text-anchor="middle">Plasmonic nanofluid</text>
  <text x="405" y="470" fill="#93a59c" font-size="14" text-anchor="middle">volumetric absorption of sunlight</text>

  <rect x="590" y="474" width="116" height="140" rx="22" fill="url(#tank)" stroke="#c4d3cc" stroke-opacity=".5" stroke-width="2"/>
  <text x="648" y="526" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">TES</text>
  <text x="648" y="546" fill="#ffffff" font-size="13" text-anchor="middle">storage tank</text>

  <path d="M560 360L772 250" stroke="#d98b65" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/>
  <circle cx="560" cy="360" r="11" fill="none" stroke="#d98b65" stroke-width="2"/>
  <rect x="772" y="120" width="380" height="250" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="796" y="152" fill="#eef3ef" font-size="17" font-weight="600">Localized surface plasmon resonance</text>
  <path d="M796 262q10-22 20 0t20 0t20 0" fill="none" stroke="#ffd166" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="826" y="296" fill="#93a59c" font-size="13" text-anchor="middle">light (E-field)</text>
  <circle cx="932" cy="262" r="70" fill="#ffd166" opacity=".25" filter="url(#glow2)"/>
  <ellipse cx="944" cy="262" rx="62" ry="54" fill="none" stroke="#8fe3ee" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="932" cy="262" r="50" fill="url(#np)"/>
  <g font-size="20" font-weight="700"><text x="884" y="268" fill="#5e9aff" text-anchor="middle">−</text><text x="980" y="269" fill="#ff5a4f" text-anchor="middle">+</text></g>
  <text x="1018" y="238" fill="#d7e3dd" font-size="15">Au / Ag</text>
  <text x="1018" y="262" fill="#d7e3dd" font-size="15">nanoparticle</text>
  <text x="1018" y="286" fill="#93a59c" font-size="14">tunable peak</text>
  <text x="796" y="350" fill="#93a59c" font-size="14">collective electron oscillation → strong absorption → heat</text>

  <rect x="772" y="390" width="380" height="245" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="796" y="420" fill="#eef3ef" font-size="17" font-weight="600">Solar absorption</text>
  <path d="M810 590C820 520 835 455 850 460C880 470 920 540 1000 565C1060 580 1100 586 1130 588L1130 590Z" fill="#ffd166" opacity=".25"/>
  <path d="M810 585L940 583C960 560 970 540 985 545C1000 560 1010 520 1040 500L1130 470" fill="none" stroke="#5e9aff" stroke-width="3"/>
  <path d="M810 470C830 450 845 445 860 455C900 480 960 470 1010 478C1060 482 1100 470 1130 462" fill="none" stroke="#ffd166" stroke-width="3.5"/>
  <path d="M810 440V590H1130" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <g fill="#93a59c" font-size="12"><text x="810" y="606" text-anchor="middle">300</text><text x="912" y="606" text-anchor="middle">1000</text><text x="1130" y="606" text-anchor="end">2500 nm</text></g>
  <path d="M800 622h20" stroke="#ffd166" stroke-width="3.5"/><text x="826" y="627" fill="#c4d3cc" font-size="13">Nanofluid</text>
  <path d="M912 622h20" stroke="#5e9aff" stroke-width="3"/><text x="938" y="627" fill="#c4d3cc" font-size="13">Base fluid</text>
  <rect x="1028" y="616" width="14" height="12" fill="#ffd166" opacity=".45"/><text x="1048" y="627" fill="#c4d3cc" font-size="13">Solar</text>
</svg>
