<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Passive daytime radiative cooling: solar reflection, atmospheric-window emission and dual-layer paint</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1512"/><stop offset="1" stop-color="#132520"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fc3b6" stroke-opacity=".05"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d22"/><stop offset=".55" stop-color="#0e2140"/><stop offset="1" stop-color="#1a3a4e"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4c2"/><stop offset=".6" stop-color="#ffd166"/><stop offset="1" stop-color="#f5a623"/></radialGradient>
    <linearGradient id="irup" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a5c"/><stop offset="1" stop-color="#4fd1e8"/></linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22322d"/><stop offset="1" stop-color="#17231f"/></linearGradient>
    <clipPath id="scene"><rect x="48" y="120" width="660" height="515" rx="16"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fd1e8"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="48" y="56" fill="#d98b65" font-size="15" font-weight="700" letter-spacing="3">02-A · ECO-FRIENDLY &amp; RENEWABLE ENERGY</text>
  <text x="48" y="92" fill="#eef3ef" font-size="29" font-weight="600">Passive Daytime Radiative Cooling (PDRC)</text>

  <!-- scene -->
  <g clip-path="url(#scene)">
    <rect x="48" y="120" width="660" height="515" fill="url(#sky)"/>
    <g fill="#ffffff"><circle cx="300" cy="160" r="1.6"/><circle cx="420" cy="140" r="1.2"/><circle cx="470" cy="190" r="1.5"/><circle cx="380" cy="205" r="1"/><circle cx="250" cy="200" r="1.2"/><circle cx="520" cy="150" r="1"/><circle cx="690" cy="200" r="1.3"/><circle cx="350" cy="232" r="1"/></g>
    <rect x="48" y="258" width="660" height="52" fill="#4fd1e8" opacity=".08"/>
    <path d="M48 258H708M48 310H708" stroke="#4fd1e8" stroke-opacity=".35" stroke-dasharray="4 6"/>
    <text x="66" y="290" fill="#8fc9d4" font-size="14">Atmosphere</text>
    <rect x="48" y="600" width="660" height="40" fill="#14201c"/>
  </g>
  <rect x="48" y="120" width="660" height="515" rx="16" fill="none" stroke="#2d3f38"/>
  <text x="66" y="152" fill="#c4d3cc" font-size="16">Outer space ≈ 3 K</text>

  <circle cx="140" cy="212" r="56" fill="#ffd166" opacity=".35" filter="url(#glow)"/>
  <circle cx="140" cy="212" r="34" fill="url(#sun)"/>

  <!-- building -->
  <rect x="250" y="455" width="400" height="145" fill="url(#bld)" stroke="#2f433c"/>
  <g fill="#2c4a52" opacity=".9"><rect x="276" y="566" width="40" height="22" rx="2"/><rect x="336" y="566" width="40" height="22" rx="2"/><rect x="524" y="566" width="40" height="22" rx="2"/><rect x="584" y="566" width="40" height="22" rx="2"/></g>
  <rect x="420" y="560" width="60" height="40" rx="2" fill="#2a3a35"/>
  <rect x="238" y="439" width="424" height="16" rx="3" fill="#f1f7f6"/>
  <g fill="#c7dbe0"><circle cx="262" cy="447" r="3"/><circle cx="300" cy="445" r="2.5"/><circle cx="342" cy="448" r="3"/><circle cx="388" cy="445" r="2.5"/><circle cx="430" cy="448" r="3"/><circle cx="474" cy="445" r="2.5"/><circle cx="516" cy="448" r="3"/><circle cx="560" cy="445" r="2.5"/><circle cx="604" cy="448" r="3"/><circle cx="640" cy="446" r="2.5"/></g>
  <text x="450" y="500" fill="#eef3ef" font-size="18" font-weight="600" text-anchor="middle">T<tspan font-size="13" dy="4">surface</tspan><tspan dy="-4"> &lt; T</tspan><tspan font-size="13" dy="4">ambient</tspan></text>
  <text x="450" y="530" fill="#93a59c" font-size="15" text-anchor="middle">sub-ambient cooling · 냉방 부하 저감</text>

  <!-- solar in / reflected -->
  <g fill="none" stroke="#ffd166" stroke-width="3" marker-end="url(#ay)">
    <path d="M165 238L330 434"/><path d="M180 226L392 434"/>
  </g>
  <g fill="none" stroke="#ffe7a3" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ay)">
    <path d="M334 434L420 336"/><path d="M396 434L482 336"/>
  </g>
  <text x="452" y="322" fill="#ffd98a" font-size="16" font-weight="600" text-anchor="middle">Solar reflection</text>

  <!-- IR emission -->
  <g fill="none" stroke="url(#irup)" stroke-width="3" stroke-linecap="round">
    <path d="M560 432c-9-14 9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s6-14 0-24"/>
    <path d="M605 432c-9-14 9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s6-14 0-24"/>
    <path d="M650 432c-9-14 9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s9-24 0-38s6-14 0-24"/>
  </g>
  <g fill="#4fd1e8"><polygon points="551,186 560,168 569,186"/><polygon points="596,186 605,168 614,186"/><polygon points="641,186 650,168 659,186"/></g>
  <text x="690" y="152" fill="#8fe3ee" font-size="16" font-weight="600" text-anchor="end">IR emission → space</text>

  <!-- spectrum -->
  <rect x="740" y="120" width="412" height="320" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="764" y="152" fill="#eef3ef" font-size="17" font-weight="600">Spectral design of the coating</text>
  <rect x="1042" y="175" width="38" height="185" fill="#4fd1e8" opacity=".18"/>
  <path d="M790 360C800 300 815 192 835 196C860 204 880 278 900 316C920 340 940 352 953 358L953 360Z" fill="#ffd166" opacity=".38"/>
  <path d="M790 352L940 350C972 346 985 200 1022 190L1130 188" fill="none" stroke="#2fc77a" stroke-width="3.5"/>
  <path d="M790 175V360H1130" fill="none" stroke="#4a5d56" stroke-width="2"/>
  <g fill="#93a59c" font-size="13" text-anchor="middle"><text x="790" y="380">0.3</text><text x="883" y="380">1</text><text x="953" y="380">2.5</text><text x="1042" y="380">8</text><text x="1080" y="380">13</text><text x="1130" y="380">25</text></g>
  <text x="960" y="402" fill="#93a59c" font-size="13" text-anchor="middle">Wavelength (μm)</text>
  <text x="782" y="190" fill="#93a59c" font-size="13" text-anchor="end">1</text><text x="782" y="364" fill="#93a59c" font-size="13" text-anchor="end">0</text>
  <rect x="764" y="416" width="14" height="12" fill="#ffd166" opacity=".6"/><text x="784" y="427" fill="#c4d3cc" font-size="13">Solar spectrum</text>
  <rect x="896" y="416" width="14" height="12" fill="#4fd1e8" opacity=".5"/><text x="916" y="427" fill="#c4d3cc" font-size="13">Atm. window</text>
  <path d="M1012 422h20" stroke="#2fc77a" stroke-width="3.5"/><text x="1038" y="427" fill="#c4d3cc" font-size="13">Emissivity ε</text>

  <!-- cross-section -->
  <rect x="740" y="460" width="412" height="175" rx="16" fill="#0f1a17" stroke="#2d3f38"/>
  <text x="764" y="491" fill="#eef3ef" font-size="17" font-weight="600">Dual-layer radiative cooling paint</text>
  <rect x="764" y="506" width="364" height="38" fill="#dfeceb"/>
  <rect x="764" y="544" width="364" height="38" fill="#ffffff"/>
  <rect x="764" y="582" width="364" height="18" fill="#56636a"/>
  <g fill="#bcd3d8" stroke="#8fb0b8"><circle cx="1010" cy="518" r="7"/><circle cx="1036" cy="530" r="8"/><circle cx="1064" cy="517" r="6"/><circle cx="1090" cy="531" r="8"/><circle cx="1114" cy="518" r="6"/><circle cx="988" cy="532" r="6"/></g>
  <g fill="#c8ccd0"><circle cx="996" cy="556" r="2.5"/><circle cx="1010" cy="568" r="2.5"/><circle cx="1024" cy="555" r="2.5"/><circle cx="1038" cy="570" r="2.5"/><circle cx="1052" cy="557" r="2.5"/><circle cx="1066" cy="569" r="2.5"/><circle cx="1080" cy="555" r="2.5"/><circle cx="1094" cy="568" r="2.5"/><circle cx="1108" cy="556" r="2.5"/><circle cx="1120" cy="570" r="2.5"/><circle cx="1003" cy="575" r="2"/><circle cx="1059" cy="548" r="2"/><circle cx="1115" cy="548" r="2"/></g>
  <text x="776" y="530" fill="#1c2b27" font-size="14" font-weight="600">Top · IR-emissive layer</text>
  <text x="776" y="568" fill="#1c2b27" font-size="14" font-weight="600">Bottom · solar-reflective (TiO₂)</text>
  <text x="776" y="596" fill="#eef3ef" font-size="12">Substrate</text>
  <text x="764" y="622" fill="#93a59c" font-size="14">Spray coating · scalable &amp; durable</text>
</svg>
